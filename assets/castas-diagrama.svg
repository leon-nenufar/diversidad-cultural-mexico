<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620">
<style>text{font-family:Arial,sans-serif;fill:#17211d}.h{font-size:34px;font-weight:700}.t{font-size:23px}.s{font-size:18px;fill:#5f6d66}.box{fill:#fff;stroke:#c9c4b8;stroke-width:2}.main{fill:#f3eadb;stroke:#8b3a3a;stroke-width:3}.line{stroke:#8b3a3a;stroke-width:4;fill:none}</style>
<rect width="1200" height="620" fill="#fbfaf6"/>
<text x="600" y="55" text-anchor="middle" class="h">Ejemplo simplificado del sistema de castas novohispano</text>
<text x="600" y="88" text-anchor="middle" class="s">Las etiquetas históricas clasificaban mezclas y estaban asociadas a jerarquías sociales.</text>
<rect x="70" y="155" rx="16" width="240" height="90" class="box"/><text x="190" y="210" text-anchor="middle" class="t">Español</text>
<rect x="70" y="350" rx="16" width="240" height="90" class="box"/><text x="190" y="405" text-anchor="middle" class="t">Indígena</text>
<path d="M310 200 C400 200 410 300 490 300" class="line"/><path d="M310 395 C400 395 410 300 490 300" class="line"/>
<rect x="490" y="255" rx="16" width="220" height="90" class="main"/><text x="600" y="310" text-anchor="middle" class="t">Mestizo</text>
<rect x="890" y="155" rx="16" width="240" height="90" class="box"/><text x="1010" y="210" text-anchor="middle" class="t">Española</text>
<path d="M710 300 C790 300 800 200 890 200" class="line"/>
<rect x="815" y="350" rx="16" width="260" height="90" class="main"/><text x="945" y="405" text-anchor="middle" class="t">Castizo</text>
<path d="M710 300 C790 300 780 395 815 395" class="line"/><path d="M1010 245 L1010 350" class="line"/>
<text x="600" y="515" text-anchor="middle" class="s">Este esquema es didáctico: no representa toda la complejidad de las 16 categorías mostradas en pinturas de castas.</text>
<text x="600" y="550" text-anchor="middle" class="s">El sitio usa estas clasificaciones como objeto histórico, no como categorías raciales válidas en la actualidad.</text>
</svg>